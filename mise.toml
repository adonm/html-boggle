[tools]
deno = "2"
rust = "1.96"
emsdk = "3.1.71"
node = "26"

[tasks]
# One-time setup: rust wasm target + fetch vendored build inputs (raylib web lib, wasm-bindgen-cli, word list, jsmn).
setup = "rustup target add wasm32-unknown-unknown && deno run -A scripts/setup.ts"
# Build the iroh wasm module, the raylib wasm game, and assemble dist/.
build = "deno run -A scripts/build.ts"
# Rebuild on source change and serve at http://localhost:8000
dev = "deno run -A scripts/dev.ts"
# Serve an existing dist/ build.
serve = "deno run -A server/main.ts"
# Two real browsers join one room and play a word (needs a chromium headless shell).
test = "node scripts/e2e-web.mjs"
