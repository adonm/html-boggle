[tools]
deno = "2"
rust = "1.96"
node = "26"
flutter = "3.47.0"

[tasks]
# One-time setup: rust wasm target + fetch vendored build inputs (wasm-bindgen-cli, word list).
setup = "rustup target add wasm32-unknown-unknown && deno run -A scripts/setup.ts"
# Build the iroh wasm module, the Flutter web app, and assemble dist/.
build = "deno run -A scripts/build.ts"
# Rebuild on source change and serve at http://localhost:8000
dev = "deno run -A scripts/dev.ts"
# Serve an existing dist/ build.
serve = "deno run -A server/main.ts"
# Two real browsers join one room and play a word (needs a chromium headless shell).
test = "node scripts/e2e-web.mjs"
# Scattergories round: duplicates cancel, scores agree on both sides.
test-scatter = "node scripts/e2e-scatter.mjs"
# SketchIt round: real canvas strokes sync; a correct guess scores and ends the round.
test-sketch = "node scripts/e2e-sketch.mjs"
# Capture Chess: UI + hook moves, capture-the-king win, mid-game spectator agrees.
test-chess = "node scripts/e2e-chess.mjs"
# Identity/room persistence: reload auto-rejoins the live round; leave clears the cache.
test-resume = "node scripts/e2e-resume.mjs"
# Go (9x9): UI stone + capture sequence, pass-pass end, area scoring agrees.
test-go = "node scripts/e2e-go.mjs"
# Word Tiles: play through the center star, pass-pass end, derived scores agree.
test-wt = "node scripts/e2e-wt.mjs"
