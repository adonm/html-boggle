<!DOCTYPE html>
<html>
<head>
  <!--
    Resolve all relative URLs (flutter_bootstrap.js, glue.js, canvaskit, ...)
    against the directory this page is actually served from. flutter build
    hardcodes a static <base href> (usually "/"), which breaks GitHub Pages
    project pages served from a subpath - so we insert the REAL base first;
    the first <base> element in a document wins.
  -->
  <script>
    (function () {
      var src = document.currentScript && document.currentScript.src
        ? document.currentScript.src
        : document.location.href;
      var base = document.createElement("base");
      base.href = new URL(".", src).href;
      document.head.appendChild(base);
    })();
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Multiplayer Boggle over iroh gossip">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Boggle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Boggle — Multiplayer Word Game</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #242424;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    flutter-view {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* keep the semantics DOM inputs fully interactive; iOS Safari zooms into
     * focused inputs smaller than 16px, so pin the font size there too */
    flt-semantics-host input,
    flt-semantics-host textarea {
      touch-action: auto;
      -webkit-user-select: text;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <script>
    // Belt and suspenders against browser touch zoom (pinch on iOS Safari,
    // double-tap elsewhere): the game owns all gestures.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- iroh gossip bridge (Rust wasm); driven by the Flutter app via JS interop -->
  <script type="module" src="glue.js"></script>
</body>
</html>
