name: boggle_app
description: "Multiplayer Boggle over iroh gossip, styled with Yaru."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  yaru: ^10.2.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  perfect_freehand: ^2.5.2+1
  chess: ^0.8.1
  audioplayers: ^6.2.0
  qr_flutter: ^4.1.0
  vibration: ^2.1.0
  chess_vectors_flutter: ^1.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/words.txt
    - assets/sfx/
